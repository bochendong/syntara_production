name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vercel:
    name: Deploy Vercel
    needs: railway
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      (needs.railway.result == 'success' ||
        (github.event_name == 'workflow_run' && contains(github.event.workflow_run.head_commit.message, '[railway-deployed]')))
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_eNxElDgJsweQUNuESI6majDN
      VERCEL_PROJECT_ID: prj_EExPAT88VCiR2Z7bO6qleEpIgOAg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Vercel credentials
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing GitHub secret VERCEL_TOKEN"; exit 1; }
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if [ "$status" != "200" ]; then
            message="$(jq -r '.error.message // "Unknown Vercel API error"' "$response_file")"
            echo "::error title=Vercel credentials rejected::$message (HTTP $status)"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel production configuration
        shell: bash
        run: |
          set +e
          output="$(vercel pull --yes --environment=production \
            --scope bochendongs-projects \
            --token "$VERCEL_TOKEN" 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message="$(printf '%s\n' "$output" | tail -n 8 | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Vercel pull failed::$message"
            exit "$status"
          fi

      - name: Build for Vercel
        run: >-
          vercel build --prod
          --scope bochendongs-projects
          --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        run: >-
          vercel deploy --prebuilt --prod
          --scope bochendongs-projects
          --token "$VERCEL_TOKEN"

  railway:
    name: Deploy Railway
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      !(github.event_name == 'workflow_run' && contains(github.event.workflow_run.head_commit.message, '[railway-deployed]'))
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Railway credentials
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "Missing GitHub secret RAILWAY_TOKEN"; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "Missing GitHub variable RAILWAY_PROJECT_ID"; exit 1; }
          test -n "$RAILWAY_ENVIRONMENT_ID" || { echo "Missing GitHub variable RAILWAY_ENVIRONMENT_ID"; exit 1; }
          test -n "$RAILWAY_SERVICE_ID" || { echo "Missing GitHub variable RAILWAY_SERVICE_ID"; exit 1; }

      - name: Deploy to Railway production
        run: >-
          npx --yes @railway/cli@latest up --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --service "$RAILWAY_SERVICE_ID"
