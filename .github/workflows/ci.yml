name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, codex/native-google-staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Resolve comparison base
        id: comparison
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          base_sha="$CI_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git merge-base HEAD "origin/$CI_DEFAULT_BRANCH")"
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Prettier
        env:
          CI_BASE_SHA: ${{ steps.comparison.outputs.sha }}
        run: pnpm check:changed -- "$CI_BASE_SHA"

      - name: ESLint
        env:
          CI_BASE_SHA: ${{ steps.comparison.outputs.sha }}
        run: pnpm lint:changed -- "$CI_BASE_SHA"

      - name: TypeScript
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc --noEmit
