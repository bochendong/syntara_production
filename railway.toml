# Railway config-as-code — https://docs.railway.com/guides/config-as-code
# Ensures `next build` runs before `next start` (requires `.next` with BUILD_ID).

[build]
builder = "NIXPACKS"
# Monorepo uses pnpm; install + build so the image always has a production `.next`.
buildCommand = "pnpm install && pnpm run build"

[deploy]
# Apply only committed Prisma migrations before the new app starts. Railway runs
# this command inside the service network with the configured DATABASE_URL.
preDeployCommand = "npx prisma migrate deploy"
# Use Node directly: Nixpacks runtime image may not have `pnpm` on PATH (catatonit: failed to exec pid1).
startCommand = "node scripts/workers/start-with-worker.mjs"
restartPolicyType = "ON_FAILURE"

# GitHub codex/staging-next is the authoritative staging source. Keep production
# defaults above unchanged. Documentation-only commits do not redeploy staging.
[environments.staging.build]
buildCommand = "node scripts/deploy/restore-desktop-release.mjs && pnpm install --frozen-lockfile && pnpm run build"
watchPatterns = ["**", "!docs/**", "!**/*.md"]

[environments.staging.deploy]
preDeployCommand = "node node_modules/prisma/build/index.js migrate deploy"
startCommand = "node node_modules/next/dist/bin/next start --hostname 0.0.0.0"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
