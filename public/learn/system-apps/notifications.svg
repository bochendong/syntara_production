  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f7fa"/></linearGradient>
</defs>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8f8fb"/></linearGradient>
<radialGradient id="redGlow"><stop offset="0" stop-color="#ff453a" stop-opacity=".42"/><stop offset="1" stop-color="#ff453a" stop-opacity="0"/></radialGradient>
<linearGradient id="dot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b61"/><stop offset="1" stop-color="#ff2d2d"/></linearGradient>

