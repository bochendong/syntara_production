<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

<defs>
  <linearGradient id="tileBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="58%" stop-color="#FBFCFF"/>
    <stop offset="100%" stop-color="#F1F4FB"/>
  </linearGradient>
  <linearGradient id="tileHighlight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#667085" flood-opacity="0.20"/>
  </filter>
  <filter id="softShadow" x="-35%" y="-35%" width="170%" height="180%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#52608F" flood-opacity="0.25"/>
  </filter>
  <filter id="innerGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
  </filter>
</defs>


<g transform="translate(256 256) scale(0.9090909091) translate(-256 -256)"><rect x="36" y="36" width="440" height="440" rx="92" fill="url(#tileBg)" filter="url(#tileShadow)"/>
<path d="M128 64H384C427 64 448 86 448 128V206          C395 177 319 160 256 160C193 160 117 177 64 206V128          C64 86 86 64 128 64Z" fill="url(#tileHighlight)" opacity="0.68"/>

<g filter="url(#softShadow)">
  <!-- chart guide lines -->
  <g stroke="#C9D2E7" stroke-width="4" stroke-linecap="round" opacity="0.42">
    <path d="M128 188H386"/>
    <path d="M128 246H386"/>
    <path d="M128 304H386"/>
  </g>

  <!-- bars -->
  <rect x="137" y="290" width="52" height="94" rx="14" fill="url(#bar1)"/>
  <rect x="203" y="250" width="52" height="134" rx="14" fill="url(#bar2)"/>
  <rect x="269" y="222" width="52" height="162" rx="14" fill="url(#bar3)"/>
  <rect x="335" y="188" width="52" height="196" rx="14" fill="url(#bar4)"/>

  <!-- bar highlights -->
  <g fill="#FFFFFF" opacity="0.22">
    <rect x="146" y="298" width="12" height="70" rx="6"/>
    <rect x="212" y="258" width="12" height="102" rx="6"/>
    <rect x="278" y="230" width="12" height="126" rx="6"/>
    <rect x="344" y="196" width="12" height="154" rx="6"/>
  </g>

  <!-- baseline -->
  <rect x="124" y="380" width="276" height="15" rx="8" fill="#5A67D8"/>

  <!-- trend line -->
  <path d="M158 272L226 204L294 226L362 150" fill="none" stroke="url(#trend)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dots -->
  <g>
    <circle cx="158" cy="272" r="18" fill="#54C8F4"/>
    <circle cx="226" cy="204" r="18" fill="#5D84F1"/>
    <circle cx="294" cy="226" r="18" fill="#7B6BEF"/>
    <circle cx="362" cy="150" r="18" fill="#A34EEB"/>
    <circle cx="152" cy="266" r="8" fill="url(#dotGlow)" opacity="0.9"/>
    <circle cx="220" cy="198" r="8" fill="url(#dotGlow)" opacity="0.9"/>
    <circle cx="288" cy="220" r="8" fill="url(#dotGlow)" opacity="0.9"/>
    <circle cx="356" cy="144" r="8" fill="url(#dotGlow)" opacity="0.9"/>
  </g>
</g>
</g><defs>
  <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8DE2FF"/>
    <stop offset="100%" stop-color="#4CB8ED"/>
  </linearGradient>
  <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7ABEFF"/>
    <stop offset="100%" stop-color="#4E78EE"/>
  </linearGradient>
  <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9F8CFF"/>
    <stop offset="100%" stop-color="#6C56E6"/>
  </linearGradient>
  <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
