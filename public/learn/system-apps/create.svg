<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow1" x="80" y="80" width="864" height="864" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#AAB7D6" flood-opacity="0.28"/>
    </filter>
    <filter id="shadow2" x="200" y="200" width="624" height="624" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2D7BEB" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="bgGrad" x1="128" y1="128" x2="896" y2="896" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9F9FB"/>
      <stop offset="1" stop-color="#F1F1F5"/>
    </linearGradient>
    <radialGradient id="marbleGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(440 420) rotate(50) scale(330)">
      <stop stop-color="#CFE6FF"/>
      <stop offset="0.55" stop-color="#6EB1FF"/>
      <stop offset="1" stop-color="#2D7BEB"/>
    </radialGradient>
  </defs>

  <!-- App icon base -->
  <g filter="url(#shadow1)">
    <rect x="128" y="128" width="768" height="768" rx="120" fill="url(#bgGrad)"/>
  </g>

  <!-- Glass marble -->
  <g filter="url(#shadow2)">
    <circle cx="512" cy="512" r="250" fill="url(#marbleGrad)"/>
    <circle cx="512" cy="512" r="248" stroke="#1E4E9A" stroke-opacity="0.35" stroke-width="4"/>
  </g>
  <ellipse cx="420" cy="380" rx="70" ry="38" transform="rotate(-30 420 380)" fill="white" fill-opacity="0.85"/>

  <!-- Plus -->
  <rect x="487" y="392" width="50" height="240" rx="25" fill="white"/>
  <rect x="392" y="487" width="240" height="50" rx="25" fill="white"/>
</svg>
