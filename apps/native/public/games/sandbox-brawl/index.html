<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Baloo+2:wght@600;800&family=Noto+Sans+SC:wght@400;600;800&display=swap">
<style>
/* Layout: full-screen 3D classroom; UI is a "sticker sheet" on top of it: cream paper pieces with a thick ink outline and a hard drop shadow, same ink colour as the 3D outlines. Home = logo + one big button over a low camera shot of the class; Prep = hero carousel on the left, one settings sheet on the right (bottom sheet on phones). One deliberate light look. */
:root {
  --ink: #3a2228; --paper: #fffaf0; --paper2: #fff0d2; --dim: #8d7268; --line: rgba(58,34,40,.16);
  --sun: #ffc93c; --sun2: #ffab2e; --coral: #ff6b6b; --sky: #4aa8ff; --mint: #3fc98a; --lilac: #a98bff; --bad: #f04a4a; --ok: #2fb574;
  --disp: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
  --num: "Baloo 2", "Noto Sans SC", sans-serif;
  --body: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bounce: cubic-bezier(.2, 1.5, .4, 1);
  color-scheme: light;
}
@property --r { syntax: '<length>'; inherits: false; initial-value: 2000px; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: #eadcc2; color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#stage { position: fixed; inset: 0; transition: filter .6s; }
#stage.dead { filter: grayscale(.85) brightness(.8); }
#stage canvas { display: block; width: 100%; height: 100%; }
#wipe { position: fixed; inset: 0; z-index: 60; pointer-events: none; background: var(--ink); -webkit-mask: radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 2px)); mask: radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 2px)); transition: --r .4s cubic-bezier(.6, 0, .4, 1); }
#wipe.close { --r: 0px; }

.frame { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.ico { --s: 28px; width: var(--s); height: var(--s); flex: none; display: inline-grid; place-items: center; color: #fff; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, white), var(--c)); border: 2px solid var(--ink); border-radius: 32%; font-family: var(--disp); font-size: calc(var(--s) * .56); line-height: 1; }
.ico svg { width: 66%; height: 66%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 0 rgba(58,34,40,.45)); }
.item-illustration { display: block; object-fit: contain; }
.ico.illustrated .item-illustration { width: 100%; height: 100%; min-width: 0; min-height: 0; }
.role { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; color: #fff; background: var(--c); border: 1.5px solid var(--ink); }

/* ---------- 局内 HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }
.top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; }
.pcard { display: flex; gap: 9px; align-items: center; padding: 7px 12px 7px 7px; width: min(250px, 100%); border-radius: 18px; }
.pcard.hurt { animation: shakeX .3s; } .pcard.low .hpbar i { animation: lowhp .5s infinite alternate; }
.pcard.healing .hpbar i { animation: hp-heal .46s ease-out; }
@keyframes hp-heal { 0%, 35% { background: #49c981; } }
@keyframes shakeX { 20% { transform: translate(-5px, 1px) rotate(-1.5deg); } 50% { transform: translate(4px, -1px) rotate(1deg); } 80% { transform: translateX(-2px); } }
@keyframes lowhp { to { filter: brightness(1.5); } }
.pbars { flex: 1; min-width: 0; display: grid; gap: 4px; }
.prow { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 13px; }
.lvb { font-family: var(--num); font-size: 12px; color: #fff; background: var(--sky); border: 1.5px solid var(--ink); border-radius: 999px; padding: 0 8px; line-height: 1.5; } .lvb.pop { animation: pop .5s var(--bounce); }
.bar { position: relative; height: 16px; border-radius: 999px; background: #5a3a40; border: 2px solid var(--ink); overflow: hidden; }
.bar i, .bar u { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 999px; }
.bar i { background: linear-gradient(180deg, #ff9a8a 0 38%, var(--coral) 38%); transition: width .12s; }
.bar u { background: #fff; transition: width .5s .25s; }
.bar em { position: absolute; inset: 0; display: grid; place-items: center; font: 800 11px/1 var(--num); font-style: normal; color: #fff; text-shadow: 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); }
.xpbar { height: 9px; } .xpbar i { background: linear-gradient(180deg, #9fdcff 0 40%, var(--sky) 40%); transition: width .2s; }
.clock { justify-self: center; padding: 2px 18px 5px; text-align: center; border-radius: 16px; }
.clock b { display: block; font: 800 24px/1.15 var(--num); }
.clock small { display: block; font-size: 10.5px; font-weight: 600; color: var(--dim); white-space: nowrap; }
.meta { justify-self: end; display: flex; gap: 7px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 11px 0 8px; border-radius: 999px; font: 800 16px/1 var(--num); box-shadow: 0 3px 0 var(--ink); }
.pill svg { width: 17px; height: 17px; } .pill.pop { animation: pop .45s var(--bounce); }
button.pill { pointer-events: auto; padding: 0; width: 34px; justify-content: center; color: var(--ink); background: var(--paper); font-size: 13px; }
#audioBtn .audio-slash, #audioBtn[aria-pressed="true"] .audio-waves { display: none; }
#audioBtn[aria-pressed="true"] .audio-slash { display: inline; }
@keyframes pop { 30% { transform: scale(1.35) rotate(-6deg); } }
#bossBar { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 76px); left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 28px)); text-align: center; animation: drop .5s var(--bounce); }
#bossBar span { display: inline-block; position: relative; z-index: 1; font-family: var(--disp); font-size: 17px; color: #fff; background: #8b1e3f; border: 2.5px solid var(--ink); border-radius: 999px; padding: 0 16px 2px; margin-bottom: -9px; }
#bossBar .bar { height: 20px; } #bossBar .bar i { background: linear-gradient(180deg, #ff7a9a 0 38%, #e02a5a 38%); }
@keyframes drop { from { transform: translate(-50%, -80px); } }
.task { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 74px); left: 50%; width: min(330px, calc(100% - 28px)); margin-left: max(-165px, calc(-50% + 14px)); display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; align-items: center; padding: 8px 12px 9px 9px; border-radius: 16px; animation: taskIn .55s var(--bounce); transition: background .2s; }
#hud.boss .task { top: calc(env(safe-area-inset-top, 0px) + 128px); }
@keyframes taskIn { from { transform: translateY(-140px) rotate(-5deg); } }
.task .ico { grid-row: span 2; --s: 40px; }
.task .tn { font-weight: 800; font-size: 14px; line-height: 1.2; } .task .tn small { display: block; font-weight: 600; font-size: 11px; color: var(--dim); }
.task .tt { font: 800 15px/1 var(--num); background: var(--paper2); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 9px; } .task .tt.hot { background: var(--bad); color: #fff; animation: lowhp .4s infinite alternate; }
.task .tp { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; font: 800 12px/1 var(--num); }
.task .tp .bar { flex: 1; height: 12px; } .task .tp .bar i { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, white) 0 40%, var(--c) 40%); transition: width .2s; }
.task .dots { display: flex; gap: 5px; flex: 1; } .task .dots i { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--ink); background: #e8dcc4; transition: background .15s, transform .25s var(--bounce); } .task .dots i.on { background: var(--c); transform: scale(1.15) rotate(8deg); }
.task.bump { animation: bump .25s; } @keyframes bump { 40% { transform: scale(1.06); } }
.task.done { background: #d8f7e2; animation: taskOut .5s 1s both; } .task.fail { background: #eadfdc; filter: grayscale(.6); animation: taskOut .5s 1s both; }
@keyframes taskOut { to { transform: translateY(-160px) rotate(4deg); opacity: 0; } }
.task .stamp { position: absolute; right: 10px; top: 50%; font-family: var(--disp); font-size: 24px; color: var(--ok); border: 3px solid currentColor; border-radius: 10px; padding: 0 10px 2px; background: rgba(255,255,255,.85); transform: translateY(-50%) rotate(-10deg); animation: stamp .35s var(--bounce); } .task.fail .stamp { color: var(--dim); }
@keyframes stamp { from { transform: translateY(-50%) rotate(-10deg) scale(2.6); opacity: 0; } }
#tmark { position: absolute; left: 0; top: 0; will-change: transform; }
#tmark .pin { display: flex; align-items: center; gap: 5px; padding: 3px 9px 3px 3px; border-radius: 999px; font: 800 13px/1 var(--num); white-space: nowrap; box-shadow: 0 3px 0 var(--ink); animation: bob 1s ease-in-out infinite alternate; }
#tmark .ico { --s: 24px; border-radius: 50%; }
#tmark .arr { position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -7px 0 0 -7px; border: 7px solid transparent; border-bottom: 12px solid var(--ink); border-top: 0; transform-origin: 7px 6px; }
@keyframes bob { to { translate: 0 -5px; } }
#rmark { position: absolute; left: 0; top: 0; will-change: transform; }
#rmark .pin { display: flex; align-items: center; gap: 5px; padding: 3px 9px 3px 3px; border-radius: 999px; font: 800 13px/1 var(--num); white-space: nowrap; box-shadow: 0 3px 0 var(--ink); animation: bob 1s ease-in-out infinite alternate; }
#rmark .ico { --s: 24px; border-radius: 50%; }
#rmark .arr { position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -7px 0 0 -7px; border: 7px solid transparent; border-bottom: 12px solid var(--ink); border-top: 0; transform-origin: 7px 6px; }
.slot .els { position: absolute; left: -4px; top: -8px; display: flex; gap: 2px; }
.slot .els .ico { --s: 20px; border: 1.5px solid var(--ink); border-radius: 7px; background: var(--paper); box-shadow: 0 1px 0 var(--ink); }
.dock { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px; }
.slots { display: flex; gap: 10px; justify-content: center; }
.skill-dock { display: grid; gap: 12px; }
.active-duos:not([hidden]) { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.duo-badge .ico { background: #e1faf0; border-radius: 10px; box-shadow: 0 2px 0 var(--ink); }
.slot { position: relative; width: 62px; display: grid; justify-items: center; gap: 3px; }
.slot .ico { --s: 54px; border-width: 2.5px; border-radius: 16px; box-shadow: 0 4px 0 var(--ink); }
.slot .lv { position: absolute; right: -5px; top: -7px; min-width: 22px; text-align: center; font: 800 12px/1.5 var(--num); color: var(--ink); background: var(--sun); border: 2px solid var(--ink); border-radius: 999px; padding: 0 5px; }
.slot .wn { font-size: 11px; font-weight: 800; white-space: nowrap; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 0 7px; margin-top: 2px; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
.slot.empty .ico { background: rgba(255,250,240,.55); color: var(--ink); border-style: dashed; box-shadow: none; } .slot.empty .wn { opacity: .75; }
.slot.evo .ico { box-shadow: 0 4px 0 var(--ink), 0 0 0 3px var(--sun), 0 0 16px 4px rgba(255,201,60,.8); } .slot.evo .lv { background: var(--coral); color: #fff; }
.slot.ready .lv { animation: lowhp .5s infinite alternate; }
.slot.bump .ico { animation: pop .5s var(--bounce); }
.items { grid-column: 1 / -1; justify-self: start; display: flex; align-items: center; gap: 5px; max-width: calc(50% - 172px); min-width: 0; }
.item-strip { display: flex; gap: 5px; padding: 3px 4px 5px; min-width: 0; overflow-x: auto; scrollbar-width: thin; touch-action: pan-x; pointer-events: auto; }
.item-chip { position: relative; flex: 0 0 auto; width: 39px; height: 37px; display: grid; place-items: center; padding: 0; border: 2px solid var(--ink); border-radius: 9px; box-shadow: 0 2px 0 var(--ink); background: var(--paper); }
.item-chip::before { content: ""; position: absolute; inset: auto 3px 2px; height: 3px; border-radius: 3px; background: var(--item-color); }
.item-chip img { width: 30px; height: 30px; }
.item-stack { position: absolute; right: 0; bottom: 0; padding: 0 2px; border-radius: 5px 0 5px 0; background: var(--ink); color: #fff; font: 800 11px/1.35 var(--num); }
.item-chip:hover, .item-chip:focus-visible { transform: none; background: var(--paper2); box-shadow: 0 2px 0 var(--ink); }
.items-open { flex: none; padding: 5px 8px; border-radius: 9px; font-size: 12px; pointer-events: auto; }
.dock .skill-dock { grid-column: 2; }
.panel.inventory { width: min(620px, 100%); }
.inventory-list { list-style: none; display: grid; gap: 7px; max-height: 55dvh; overflow-y: auto; touch-action: pan-y; margin: 0; padding: 3px; }
.inventory-list li { display: flex; gap: 9px; align-items: center; padding: 7px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper2); }
.inventory-list li:focus { outline: 2px solid var(--sky); outline-offset: -2px; }
.inventory-list img { width: 36px; height: 36px; flex: none; }
.inventory-list small { display: block; font-size: 12px; }
.inventory-list b span { color: var(--dim); margin-left: 4px; }
.builds { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.bchip { display: flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; box-shadow: 0 3px 0 var(--ink); }
.bchip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); border: 1.5px solid var(--ink); }
.bchip .tiers { display: flex; gap: 3px; } .bchip .tiers i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink); background: #e8dcc4; } .bchip .tiers i.on { background: var(--c); }
@media (max-width: 720px) {
  .top { grid-template-columns: 1fr auto; } .clock { grid-row: 1; grid-column: 2; padding: 1px 12px 4px; } .clock b { font-size: 19px; } .meta { grid-column: 1 / 3; justify-self: start; }
  .pcard { width: 100%; } .dock { grid-template-columns: 1fr; justify-items: center; } .dock .skill-dock { grid-column: 1; } .builds { justify-content: center; order: -1; }
  .items { max-width: 100%; }
  .slot { width: 54px; } .slot .ico { --s: 46px; } .slot .wn { display: none; }
  .task, #bossBar { top: calc(env(safe-area-inset-top, 0px) + 146px); } #hud.boss .task { top: calc(env(safe-area-inset-top, 0px) + 198px); }
  #hud:has(.items:not([hidden])) :is(.task, #bossBar) { top: calc(env(safe-area-inset-top, 0px) + 184px); }
  #hud.boss:has(.items:not([hidden])) .task { top: calc(env(safe-area-inset-top, 0px) + 236px); }
}

#banner { position: fixed; left: 50%; top: 30%; z-index: 5; transform: translate(-50%, -50%) scale(.5) rotate(-6deg); opacity: 0; pointer-events: none; text-align: center; transition: opacity .18s, transform .45s var(--bounce); max-width: 94vw; }
#banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
#banner b { display: inline-block; font-family: var(--disp); font-weight: 400; font-size: clamp(28px, 6vw, 52px); line-height: 1.25; color: #fff; text-shadow: 0 3px 0 rgba(58,34,40,.35); background: var(--coral); border: 3px solid var(--ink); border-radius: 18px; padding: 0 28px 5px; box-shadow: 0 6px 0 var(--ink); white-space: nowrap; }
#banner b:has(.item-illustration) { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: normal; padding-inline: 12px; }
#banner .item-illustration { width: clamp(34px, 1em, 52px); height: auto; flex: none; }
#banner small { display: table; margin: -6px auto 0; position: relative; font-weight: 800; font-size: 13.5px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 3px 14px; box-shadow: 0 3px 0 var(--ink); }
#banner .down-taunt { display: block; max-width: min(70vw, 400px); margin: 2px auto; color: var(--ink); }
#nums { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#nums span { position: absolute; left: 0; top: 0; font: 800 17px/1 var(--num); color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; will-change: transform, opacity; }
#nums span.crit { color: var(--sun); font-size: 27px; } #nums span.crit::after { content: "!"; }
#nums span.burn { color: #ff9a4a; font-size: 14px; }
#nums span.heal { color: #83f5a8; font-size: 21px; }
#nums span.tag { font-family: var(--disp); font-size: 21px; color: #fff3b8; }
#joy { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; pointer-events: none; border: 2.5px solid var(--ink); background: rgba(255,250,240,.35); }
#joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--sun); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }

/* ---------- 按钮 ---------- */
button { font: inherit; cursor: pointer; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 10px 20px; font-weight: 800; box-shadow: 0 4px 0 var(--ink); transition: transform .12s var(--bounce), box-shadow .12s, background .15s; }
button:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
button.primary { background: linear-gradient(180deg, #ffe07a 0 45%, var(--sun) 45%); }
button.big { font-family: var(--disp); font-weight: 400; font-size: 26px; padding: 8px 44px 12px; border-width: 3px; border-radius: 20px; box-shadow: 0 6px 0 var(--ink); }
button.big:hover { box-shadow: 0 9px 0 var(--ink); transform: translateY(-3px) rotate(-1deg); }
button[disabled] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 var(--ink); }

/* ---------- 首页 ---------- */
#title { position: fixed; inset: 0; pointer-events: none; }
#title > * { pointer-events: auto; }
.home { display: grid; grid-template: auto minmax(0, 1fr) auto / auto minmax(0, 1fr) auto; justify-items: center; padding: max(26px, env(safe-area-inset-top, 0px)) max(clamp(10px, 4vw, 64px), env(safe-area-inset-right, 0px)) max(26px, env(safe-area-inset-bottom, 0px)) max(clamp(10px, 4vw, 64px), env(safe-area-inset-left, 0px)); }
.logo { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; pointer-events: none; }
.logo span { display: inline-block; font-family: var(--disp); font-size: clamp(54px, 12.5vw, 116px); line-height: 1.05; color: var(--sun); -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); animation: logoIn .7s var(--bounce) backwards, sway 2.6s ease-in-out infinite alternate; animation-delay: calc(var(--i) * 70ms), calc(var(--i) * -400ms); }
.logo span:nth-child(odd) { --tilt: -4deg; } .logo span:nth-child(even) { --tilt: 3deg; color: #fff; } .logo span:nth-child(3) { color: var(--coral); margin-left: .12em; } .logo span:nth-child(5) { color: #7fd3ff; }
@keyframes logoIn { from { transform: translateY(-140%) rotate(-30deg) scale(.4); opacity: 0; } }
@keyframes sway { from { rotate: var(--tilt); translate: 0 0; } to { rotate: calc(var(--tilt) * -0.6); translate: 0 -6px; } }
.tagline { margin: 6px 0 0; font-weight: 800; font-size: clamp(13px, 2.4vw, 17px); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 4px 18px; box-shadow: 0 3px 0 var(--ink); rotate: -1.5deg; animation: logoIn .6s .45s var(--bounce) backwards; pointer-events: none; text-align: center; }
.homeBot { grid-area: 3 / 1 / 4 / -1; display: grid; justify-items: center; gap: 12px; animation: rise .5s .5s var(--bounce) backwards; }
.homeBot .big { font-size: 34px; padding: 8px 64px 13px; animation: breathe 1.4s ease-in-out infinite alternate; }
.homeBot { grid-auto-flow: column; align-items: center; }
@keyframes breathe { to { scale: 1.05; } }
.homeHelp { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: max(clamp(10px, 4vw, 64px), env(safe-area-inset-right, 0px)); padding: 5px 16px; border-radius: 999px; box-shadow: 0 3px 0 var(--ink); font-size: 14px; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.homeTop { grid-column: 1 / -1; display: grid; justify-items: center; }
.homeLinks { grid-row: 2; align-self: center; display: grid; gap: clamp(12px, 3vh, 24px); }
.homeLinksLeft { grid-column: 1; } .homeLinksRight { grid-column: 3; }
