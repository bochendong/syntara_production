<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>校园场景 · 四个房间</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #f6f2e9; color: #342932; font: 15px/1.5 "PingFang SC", "Microsoft YaHei", sans-serif }
  main { max-width: 1480px; margin: auto; padding: 20px clamp(12px, 3vw, 44px) 24px }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; margin-bottom: 16px }
  h1 { font-size: clamp(22px, 2.2vw, 32px); margin: 0; letter-spacing: -.04em }
  p { color: #6d625d; margin: 0 }
  nav { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
  #catalog { margin-top: 16px; border-top: 1px solid #d7cabc; padding-top: 12px }
  summary { cursor: pointer; font-weight: 650; width: fit-content }
  #collections { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px 24px }
  #collections h2 { font-size: 16px; margin: 16px 0 8px }
  .props { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 6px }
  .props > * { text-align: center; padding: 6px 2px; font-size: 12px; line-height: 1.25; background: #fffcf6; border: 1px solid #d7cabc; border-radius: 6px }
  .props button:hover, .props button:focus-visible { border-color: #176c65; background: #f0f6ea }
  .props img { display: block; width: 100%; height: 54px; object-fit: contain; margin: 0 auto 4px }
  @media (max-width: 680px) { #collections { grid-template-columns: 1fr } nav { margin-left: 0 } }
  button { font: inherit; color: inherit; cursor: pointer }
  #back { border: 1px solid #ad9e8e; background: #fffaf0; border-radius: 8px; padding: 5px 12px }
  #rooms { position: relative; margin: 0 auto; width: 100%; max-width: min(100%, calc((100svh - 132px) * 1.5988)); aspect-ratio: 1586/992; background: #e5dfd0; border-radius: 10px; overflow: hidden }
  #rooms.focused { max-width: min(100%, calc((100svh - 110px) * 1.68)); aspect-ratio: 1.68 }
  #campus { width: 100%; height: 100%; display: block }
  .focused #campus { cursor: grab; touch-action: none }
  .focused #campus:active { cursor: grabbing }
  .room { position: absolute; padding: 0; border: 0; background: transparent; border-radius: 4px }
  .room:hover, .room:focus-visible { outline: 2px solid #315a4b; outline-offset: -3px; background: #fffff913 }
  .room span { position: absolute; left: 8px; top: 7px; padding: 2px 9px; border-radius: 4px; border: 1px solid #b7aa95; background: #fffcf1ed; font-weight: 650; opacity: 0 }
  .room:hover span, .room:focus-visible span { opacity: 1 }
  #location { font-weight: 650; color: #495e4d }
  #back:focus-visible, #campus:focus-visible { outline: 3px solid #176c65; outline-offset: -3px }
  #pad { display: none; position: absolute; left: 12px; bottom: 12px; grid-template-columns: repeat(3,42px); grid-template-rows: repeat(2,42px); gap: 3px }
  #pad button { border: 1px solid #aa9988; border-radius: 8px; background: #fff9eeed; font-weight: 700; user-select: none; touch-action: none }
  #pad button:first-child { grid-column: 2 }
  #pad button:nth-child(2) { grid-column: 1 }
  [hidden] { display: none !important }
  @media (pointer: coarse) { .focused #pad { display: grid } }
  @media (max-width: 580px) { main { padding: 12px 10px } header { margin-bottom: 10px } #rooms.focused { aspect-ratio: 1 / 1.12; max-height: 72svh } p { font-size: 13px } }
</style>
<main>
  <header><h1>校园场景</h1><p id="hint">点选房间，进入校园试走。</p><nav><span id="location" hidden></span><button id="back" hidden>返回四间总览</button></nav></header>
  <section id="rooms" aria-label="校园地图">
    <canvas id="campus" tabindex="-1" aria-label="校园地图"></canvas>
    <div id="pad" aria-label="行走方向">
      <button data-key="ArrowUp" aria-label="向上走">↑</button><button data-key="ArrowLeft" aria-label="向左走">←</button>
      <button data-key="ArrowDown" aria-label="向下走">↓</button><button data-key="ArrowRight" aria-label="向右走">→</button>
    </div>
  </section>
  <details id="catalog"><summary>组件图鉴</summary><div id="collections"></div></details>
  <p id="status" role="status">正在载入场景…</p>
</main>
<script type="module" src="./rooms.js?v=eight-portals"></script>
</html>
