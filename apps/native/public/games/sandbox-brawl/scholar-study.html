<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>学霸 · 角色研究</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #e8e6e2;
      color: #29283b;
      font:
        15px system-ui,
        sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
      cursor: grab;
    }
    header {
      position: absolute;
      left: 5vw;
      top: 5vh;
      pointer-events: none;
    }
    h1 {
      font: 600 clamp(24px, 4vw, 46px) serif;
      letter-spacing: 0.12em;
      margin: 0;
    }
    p {
      font-size: 13px;
      color: #565361;
    }
    nav {
      position: absolute;
      bottom: 4vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      padding: 5px;
      border: 1px solid #fff9;
      border-radius: 30px;
      background: #fbfaf3ed;
      white-space: nowrap;
    }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 20px;
      padding: 8px 14px;
      background: transparent;
      color: inherit;
    }
    button[aria-pressed='true'] {
      background: #41374d;
      color: white;
    }
    @media (max-width: 600px) {
      header {
        top: 2vh;
      }
      p {
        margin: 4px 0;
      }
    }</style
  ><canvas aria-label="可拖动旋转的三维学霸模型"></canvas>
  <header>
    <h1>学霸</h1>
    <p>拖动旋转 · 滚轮缩放</p>
  </header>
  <nav aria-label="模型控制">
    <button data-view="portrait" aria-pressed="true">近景</button
    ><button data-view="grip">握笔</button><button data-view="full">全身</button
    ><button data-view="arena">俯视</button><button id="pause">暂停</button>
  </nav>
  <script type="module" src="./scholar-study.js"></script>
</html>
